name: Build

on:
  push:
  workflow_dispatch:

jobs:
  macos:
    name: macOS (Apple Silicon + Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Montar pacote
        run: |
          ART="build/GritDI_artefacts/Release"
          PKG="dist/GritDI-Mac"
          mkdir -p "$PKG"
          cp -R "$ART/VST3/Grit DI.vst3" "$PKG/"
          cp -R "$ART/AU/Grit DI.component" "$PKG/"
          cp -R "$ART/Standalone/Grit DI.app" "$PKG/"
          for b in "$PKG"/*.vst3 "$PKG"/*.component "$PKG"/*.app; do
            codesign --force --deep --sign - "$b"
          done
          cp "packaging/Instalar no Mac.command" "$PKG/"
          chmod +x "$PKG/Instalar no Mac.command"
          lipo -info "$PKG/Grit DI.component/Contents/MacOS/Grit DI"
          # ditto preserva permissões e assinaturas dos bundles
          ditto -c -k --keepParent "$PKG" dist/GritDI-Mac.zip

      - name: Validar AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/GritDI_artefacts/Release/AU/Grit DI.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -v aufx Grdi Thgo

      - name: Enviar
        uses: actions/upload-artifact@v4
        with:
          name: GritDI-Mac
          path: dist/GritDI-Mac.zip

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Enviar
        uses: actions/upload-artifact@v4
        with:
          name: GritDI-Windows
          path: |
            build/GritDI_artefacts/Release/VST3
            build/GritDI_artefacts/Release/Standalone
