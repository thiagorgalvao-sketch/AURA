name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (Apple Silicon + Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Montar pacote
        run: |
          ART="build/AuraBass_artefacts/Release"
          PKG="dist/AuraBass-Mac"
          mkdir -p "$PKG"
          cp -R "$ART/VST3/AURA Bass.vst3" "$PKG/"
          cp -R "$ART/AU/AURA Bass.component" "$PKG/"
          cp -R "$ART/Standalone/AURA Bass.app" "$PKG/"
          for b in "$PKG"/*.vst3 "$PKG"/*.component "$PKG"/*.app; do
            codesign --force --deep --sign - "$b"
          done
          cp "packaging/Instalar no Mac.command" "$PKG/"
          chmod +x "$PKG/Instalar no Mac.command"
          lipo -info "$PKG/AURA Bass.component/Contents/MacOS/AURA Bass"
          # ditto preserva permissões e assinaturas dos bundles
          ditto -c -k --keepParent "$PKG" dist/AuraBass-Mac.zip

      - name: Validar AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/AuraBass_artefacts/Release/AU/AURA Bass.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -v aufx Grdi Thgo

      - name: Enviar
        uses: actions/upload-artifact@v4
        with:
          name: AuraBass-Mac
          path: dist/AuraBass-Mac.zip

      - name: Publicar no Release "latest" (link de download direto)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/AuraBass-Mac.zip \
            --title "AURA Bass — versão mais recente" \
            --notes "Baixe AuraBass-Mac.zip, descompacte e rode no Terminal: bash (espaço) + arraste 'Instalar no Mac.command' + Enter." \
            --target "${{ github.sha }}"

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Enviar
        uses: actions/upload-artifact@v4
        with:
          name: AuraBass-Windows
          path: |
            build/AuraBass_artefacts/Release/VST3
            build/AuraBass_artefacts/Release/Standalone
