name: Versão navegador (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'Resources/ui/**'
      - 'Resources/ir/**'
      - 'Resources/fonts/**'
      - 'Source/Layout.h'
      - 'Tools/build-web.sh'
      - 'Tests/web-dsp-test.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Testar o processamento de áudio
        run: node Tests/web-dsp-test.js

      - name: Montar o site
        run: bash Tools/build-web.sh site

      # O site vai para o branch gh-pages. O token do Actions pode escrever no
      # repositório, mas não tem permissão para ligar o Pages: isso é feito uma
      # única vez em Settings > Pages (origem: branch gh-pages, pasta /).
      - name: Publicar no branch gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site da versão navegador — ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
